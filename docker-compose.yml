version: "3.9"

services:

  # ── PostgreSQL (production DB) ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: saas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       saas
      POSTGRES_USER:     saas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-saasdev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (cache + pub/sub + alert deduplication) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── S.A.A.S. Orchestrator ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://saas:${DB_PASSWORD:-saasdev}@db:5432/saas
      REDIS_URL:    redis://redis:6379/0
    volumes:
      - ./04_Bridge:/app/04_Bridge
      - ./logs:/app/logs
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
